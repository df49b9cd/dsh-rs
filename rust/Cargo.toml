[workspace]
resolver = "2"
members = [
    "crates/vocoderd",
    "crates/vocoder-spec-api",
    "crates/vocoder-cordis",
    "crates/vocoder-typert",
    "crates/vocoder-session",
]
# tools/codegen joins as vocoder-codegen in M0 wiring.

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

# Latest major/minor lines as of pin dates; refresh with `cargo upgrade`
# (cargo-edit). Patch releases float automatically via Cargo.lock.
[workspace.dependencies]
# async runtime / web
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = "0.7"
# Stream combinators for the one endpoint that holds a body open: the
# client-module dev SSE channel (`GET /plugins/events`). Already in the tree
# through axum; named directly so the handler can build a never-ending body.
futures-util = "0.3"
# wire
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Two on-disk formats are YAML rather than JSON because upstream owns them and
# a shared home must stay readable by both hosts: `.credentials.yaml` (the
# credential store) and `preset.yml` (a preset's display metadata).
serde_yaml = "0.9"
# errors / misc
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.14"
