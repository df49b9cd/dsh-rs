[workspace]
resolver = "2"
members = [
    "crates/vocoderd",
    "crates/vocoder-spec-api",
    "crates/vocoder-cordis",
    "crates/vocoder-typert",
]
# tools/codegen joins as vocoder-codegen in M0 wiring.

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

# Latest major/minor lines as of pin dates; refresh with `cargo upgrade`
# (cargo-edit). Patch releases float automatically via Cargo.lock.
[workspace.dependencies]
# async runtime / web
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = "0.7"
hyper = { version = "1.8", features = ["full"] }
# wire
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# errors / misc
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.14"
