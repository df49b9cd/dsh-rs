name: spec-parity

on:
  pull_request:
  push: { branches: [main] }

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: extractions/setup-just@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: dsh/pnpm-lock.yaml }
      - name: Spec must match regeneration from pinned dsh
        run: just spec-check

  rust:
    runs-on: ubuntu-latest
    steps:
      # submodules: interop.rs reads dsh/snapshots/session and asserts on the
      # generation count, so a submodule-less checkout panics.
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@1.98.1
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust -> target" }
      - name: fmt
        run: cargo fmt --all --check
        working-directory: rust
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - name: build + test
        run: cargo build --workspace && cargo test --workspace
        working-directory: rust

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      # Generated bindings are committed; regenerating must be a no-op. This
      # is the gate that makes `just codegen` trustworthy as a build step.
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@1.98.1
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "tools/codegen -> target" }
      - run: just codegen
      # `docs/spec-coverage.md` is generated too, and is committed for the
      # same reason the bindings are: a stale table is a claim about coverage
      # that no longer holds. Gating only `vocoder-spec-api` let one land.
      - run: just coverage-report
      - run: |
          git diff --exit-code -- \
            rust/crates/vocoder-spec-api \
            docs/spec-coverage.md

  conformance:
    runs-on: ubuntu-latest
    steps:
      # The **candidate half** of the wire axis. This is deliberately not
      # parity: the control run needs the dsh host's browser-auth token dance
      # (`harness/runners/run.sh dsh`), which is a local procedure, so parity
      # stays the check you run by hand. What this job catches is a candidate
      # that regresses against the spec'd contract on its own — which is the
      # weaker claim, and is labelled as such rather than being mistaken for
      # the stronger one.
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust -> target" }
      - run: cargo build --workspace
        working-directory: rust
      - name: Start vocoderd
        run: |
          mkdir -p "$RUNNER_TEMP/vocoderd-home"
          rust/target/debug/vocoderd serve \
            --home "$RUNNER_TEMP/vocoderd-home" \
            --spec spec --port 3080 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3080/ && exit 0
            sleep 1
          done
          echo "vocoderd did not become ready" >&2
          exit 1
      - name: Wire cells
        run: cargo test
        working-directory: conformance/wire
        env:
          CONFORMANCE_BASE_URL: http://127.0.0.1:3080
